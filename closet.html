<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closet Virtual - XOXO.FASHION.GIRL</title>
  
  <!-- BOOTSTRAP CSS 5.3.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER / NAVBAR (Padrão Bootstrap) -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container-fluid p-0">
        <a href="index.html" class="navbar-brand brand-title">XOXO.FASHION.GIRL</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <div class="navbar-nav">
            <a href="index.html" class="nav-link nav-script-link">Home</a>
            <a href="closet.html" class="nav-link nav-script-link active">Closet virtual</a>
            <a href="bootstrap.html" class="nav-link nav-script-link">Bootstrap</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- ÁREA DO CLOSET VIRTUAL -->
  <main class="closet-page-bg">
    <div class="container py-4 d-flex justify-content-center">
      
      <!-- CAIXA DE VIDRO ROSA (GLASSMORPHISM) -->
      <div class="closet-glass-card">
        <h1 class="closet-title">CLOSET VIRTUAL</h1>

        <div class="closet-wrapper">
          
          <!-- NÍVEL 1: BLUSAS E CASACOS -->
          <div class="closet-carousel-row">
            <button class="closet-arrow-prev" type="button" data-bs-target="#carouselTops" data-bs-slide="prev" aria-label="Anterior"></button>
            
            <div id="carouselTops" class="carousel slide closet-carousel" data-bs-interval="false">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="img/1.png" class="closet-img" alt="Blusa 1">
                </div>
                <div class="carousel-item">
                  <img src="img/2.png" class="closet-img" alt="Blusa 2">
                </div>
                <div class="carousel-item">
                  <img src="img/3.png" class="closet-img" alt="Blusa 3">
                </div>
                <div class="carousel-item">
                  <img src="img/10.png" class="closet-img" alt="Blusa 4">
                </div>
                <div class="carousel-item">
                  <img src="img/13.png" class="closet-img" alt="Blusa 5">
                </div>
                <div class="carousel-item">
                  <img src="img/14.png" class="closet-img" alt="Blusa 6">
                </div>
              </div>
            </div>

            <button class="closet-arrow-next" type="button" data-bs-target="#carouselTops" data-bs-slide="next" aria-label="Próximo"></button>
          </div>

          <!-- NÍVEL 2: CALÇAS E SAIAS -->
          <div class="closet-carousel-row">
            <button class="closet-arrow-prev" type="button" data-bs-target="#carouselBottoms" data-bs-slide="prev" aria-label="Anterior"></button>
            
            <div id="carouselBottoms" class="carousel slide closet-carousel" data-bs-interval="false">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="img/4.png" class="closet-img" alt="Calça 1">
                </div>
                <div class="carousel-item">
                  <img src="img/5.png" class="closet-img" alt="Saia 1">
                </div>
                <div class="carousel-item">
                  <img src="img/6.png" class="closet-img" alt="Calça 2">
                </div>
                <div class="carousel-item">
                  <img src="img/11.png" class="closet-img" alt="Saia 2">
                </div>
                <div class="carousel-item">
                  <img src="img/12.png" class="closet-img" alt="Saia 3">
                </div>
              </div>
            </div>

            <button class="closet-arrow-next" type="button" data-bs-target="#carouselBottoms" data-bs-slide="next" aria-label="Próximo"></button>
          </div>

          <!-- NÍVEL 3: SAPATOS -->
          <div class="closet-carousel-row">
            <button class="closet-arrow-prev" type="button" data-bs-target="#carouselShoes" data-bs-slide="prev" aria-label="Anterior"></button>
            
            <div id="carouselShoes" class="carousel slide closet-carousel" data-bs-interval="false">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="img/7.png" class="closet-img" alt="Sapato 1">
                </div>
                <div class="carousel-item">
                  <img src="img/8.png" class="closet-img" alt="Sapato 2">
                </div>
                <div class="carousel-item">
                  <img src="img/9.png" class="closet-img" alt="Sapato 3">
                </div>
                <div class="carousel-item">
                  <img src="img/15.png" class="closet-img" alt="Sapato 4">
                </div>
                <div class="carousel-item">
                  <img src="img/16.png" class="closet-img" alt="Sapato 5">
                </div>
                <div class="carousel-item">
                  <img src="img/17.png" class="closet-img" alt="Sapato 6">
                </div>
                <div class="carousel-item">
                  <img src="img/18.png" class="closet-img" alt="Sapato 7">
                </div>
                <div class="carousel-item">
                  <img src="img/carrosel de roupas.png" class="closet-img" alt="Sapato 8">
                </div>
                <div class="carousel-item">
                  <img src="img/20.png" class="closet-img" alt="Sapato 9">
                </div>
                <div class="carousel-item">
                  <img src="img/21.png" class="closet-img" alt="Sapato 10">
                </div>
                <div class="carousel-item">
                  <img src="img/22.png" class="closet-img" alt="Sapato 11">
                </div>
                <div class="carousel-item">
                  <img src="img/23.png" class="closet-img" alt="Sapato 12">
                </div>
                <div class="carousel-item">
                  <img src="img/24.png" class="closet-img" alt="Sapato 13">
                </div>
              </div>
            </div>

            <button class="closet-arrow-next" type="button" data-bs-target="#carouselShoes" data-bs-slide="next" aria-label="Próximo"></button>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-custom text-center">
    <div class="container">
      <h3 class="footer-brand">XOXO.FASHION.GIRL</h3>
      <p class="footer-text"><strong>Nome do projeto:</strong> Blog fashion</p>
      <p class="footer-text"><strong>Nome do aluno:</strong> Amira Jamal Bazerbachi</p>
      <p class="footer-text"><strong>Ano:</strong> 2026</p>
      <p class="footer-text footer-info">
        Projeto acadêmico responsivo sobre tendências de moda, desenvolvido com HTML5, CSS3 e Bootstrap 5.
      </p>
    </div>
  </footer>

  <!-- BOOTSTRAP JS 5.3.3 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- SCRIPT PERSONALIZADO -->
  <script src="js/script.js"></script>
</body>
</html>
